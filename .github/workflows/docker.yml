name: Build Docker Reutilizable

on:
  workflow_call:
    inputs:
      image_name:
        description: "Nombre de la imagen de Docker"
        required: true
        type: string

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen de Docker
        run: docker build -t ${{ inputs.image_name }}:latest .

      - name: Guardar imagen de Docker en un archivo TAR
        run: docker save -o ${{ inputs.image_name }}.tar ${{ inputs.image_name }}:latest

      - name: Subir imagen como Artefacto a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image_name }}-comprimido
          path: ${{ inputs.image_name }}.tar
          retention-days: 2
